<h2 class="title">DYNAMIC TABLE FILTER</h2>

<div class="top-bar">
  <select #fileSel (change)="changeData(fileSel.value)" class="dropdown">
    <option value="cars.json">Cars</option>
    <option value="e-commerce.json">E-Commerce</option>
    <option value="employee.json">Employee</option>
    <option value="library.json">Library</option>
  </select>

  <button (click)="changeData(fileSel.value)">LOAD DATA</button>
</div>


<div class="filter-bar">

  <!-- Column dropdown -->
  <select #colSel (change)="selectedColumn = colSel.value; onColumnChange()">
    <option value="">Select Column</option>

    <option *ngFor="let key of tableKeys" [value]="key">
      {{ key }}
    </option>
  </select>

  <!-- ✅ Operator dropdown -->
  <select #opSel (change)="selectedOperator = opSel.value">
    <option value="contains">Contains</option>
    <option value="range">Range</option>
  </select>

  <!-- ✅ Text input (for contains) -->
  <input *ngIf="selectedOperator === 'contains'"
         type="text"
         placeholder="Enter to filter..."
         #txt
         (input)="applyFilterUnified(txt.value)" />

  <!-- ✅ Range inputs -->
  <ng-container *ngIf="selectedOperator === 'range'">

    
<!-- ✅ Min dropdown -->
<select #minVal>
  <option value="">Min</option>

  <option *ngFor="let val of rangeValues" [value]="val">
    {{ val }}
  </option>
</select>

<!-- ✅ Max dropdown -->
<select #maxVal>
  <option value="">Max</option>

  <option *ngFor="let val of rangeValues" [value]="val">
    {{ val }}
  </option>
</select>


    <button (click)="applyFilterUnified(minVal.value, maxVal.value)">
      Apply
    </button>

  </ng-container>

</div>

<table class="data-table">

  <thead>
    <tr>
      <th *ngFor="let key of tableKeys">
                {{ key }}
      </th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let item of data">

      <td *ngFor="let key of tableKeys">

        <ng-container *ngIf="key === 'image'; else normal">
          <!-- <img [src]="item[key]" class="table-img" /> -->
       
        </ng-container>

        <ng-template #normal>
                {{ item[key] }}
        </ng-template>

      </td>

    </tr>
  </tbody>

</table>
